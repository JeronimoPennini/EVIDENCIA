name: evidencia
description: Síntesis de evidencia científica en salud asistida por IA.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0      # state management reactivo
  dio: ^5.7.0                   # cliente HTTP
  flutter_markdown: ^0.7.0      # renderizar síntesis en Markdown
  go_router: ^14.0.0            # navegación declarativa
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
