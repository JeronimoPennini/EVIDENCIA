# EvidencIA — Blueprint de Render (https://render.com/docs/blueprint-spec)
#
# Este archivo ya está en la raíz del repo `EVIDENCIA`, así que Render lo detecta
# al conectar el repositorio (New → Blueprint). Como alternativa, un Web Service manual:
#     Repository          = https://github.com/JeronimoPennini/EVIDENCIA
#     Runtime             = Docker
#     Dockerfile Path     = ./Dockerfile
#     Build Context Path  = /            <-- clave: el Dockerfile usa rutas backend/...
#     Health Check Path   = /health
#
#     (O sin Docker: Root Directory = backend, Runtime = Python,
#      Build Command = pip install -r requirements.txt, Start Command = python server_start.py)
#
# Después de desplegar, copiá la URL pública (https://*.onrender.com) y:
#   1) agregá el origen del frontend a ALLOWED_ORIGINS en Render (Environment), p.ej.
#      https://jeronimopennini.github.io
#   2) pasala al frontend:  flutter build web --release --dart-define=API_BASE_URL=<esa URL>
#      (o simplemente  build_web.bat <esa URL>)

services:
  - type: web
    name: evidencia-api
    # Docker: usa el Dockerfile de la raíz (contexto = raíz del repo).
    # Alternativa sin Docker: runtime: python, rootDir: backend,
    #   buildCommand: pip install -r requirements.txt, startCommand: python server_start.py
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # No se fija PYTHON_VERSION a propósito: pedir una versión que Render no
      # tiene precompilada (p.ej. 3.12.7) lo hace compilar Python desde fuente,
      # y el primer deploy se estira minutos o falla. La versión default de
      # Render sirve; si hace falta pinear, usar una que el dashboard acepte
      # sin build (se ve en Settings → Runtime).
      # --- Secretos: sync:false = se cargan a mano en el dashboard, nunca en git ---
      - key: GEMINI_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: DECS_API_KEY
        sync: false
      # --- Configuración pública ---
      # localhost alcanza para probar la API publicada desde tu Flutter local.
      # Sumá el dominio público cuando el PWA esté en el aire, separado por coma.
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:8080,https://jeronimopennini.github.io
      - key: PRIORIZAR_CALIDAD_POR_DEFECTO
        value: "true"
      # OPCIONAL: cadena de modelos de Gemini a probar, separada por coma.
      # Se deja vacía para usar la del código (gemini_service._MODELOS_RESPALDO).
      # Útil cuando Google retira un nombre: se corrige desde el dashboard y
      # guarda efecto en el próximo reinicio, sin pushear código.
      # - key: GEMINI_MODELOS
      #   value: "gemini-3.5-flash,gemini-flash-latest,gemini-3.8-flash"
