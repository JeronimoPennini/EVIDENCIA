name: Web → GitHub Pages

# Compila el PWA (Flutter web) y lo publica en GitHub Pages.
# Corre al tocar frontend/ y también se puede lanzar a mano con una URL de API
# distinta (Run workflow → API_BASE_URL).
#
# Requisito único: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  # Se excluye este propio archivo de los disparadores: editar el workflow no
  # debería publicar nada. El primer despliegue (y los que sigan) se lanzan
  # desde Actions → Web → GitHub Pages → Run workflow.
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL pública del backend (Render), sin barra final"
        required: false
        default: "https://evidencia-pljv.onrender.com"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Dependencias
        working-directory: frontend
        run: flutter pub get

      # --base-href debe coincidir con la ruta del project page: /<nombre-del-repo>/
      - name: Build web
        working-directory: frontend
        run: >-
          flutter build web --release
          --base-href /EVIDENCIA/
          --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://evidencia-pljv.onrender.com' }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
